/* ================= 音效合成器 (Web Audio API) ================= */
let audioCtx = null;
function getAudioContext() {
  if (!audioCtx) {
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    audioCtx = new AudioContext();
  }
  if (audioCtx.state === 'suspended') {
    audioCtx.resume();
  }
  return audioCtx;
}

// 答對音效：輕快上揚三連音
function playSoundCorrect() {
  try {
    const ctx = getAudioContext();
    const notes = [523.25, 659.25, 783.99]; // C5, E5, G5
    notes.forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.09);
      gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.09);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.09 + 0.22);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.09);
      osc.stop(ctx.currentTime + idx * 0.09 + 0.22);
    });
  } catch (e) {}
}

// 答錯提示音：低音嘟嘟
function playSoundIncorrect() {
  try {
    const ctx = getAudioContext();
    [220, 185].forEach((freq, idx) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
      gain.gain.setValueAtTime(0.25, ctx.currentTime + idx * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.12 + 0.15);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(ctx.currentTime + idx * 0.12);
      osc.stop(ctx.currentTime + idx * 0.12 + 0.15);
    });
  } catch (e) {}
}

// 通關勝利音樂：大和弦琶音
function playSoundVictory() {
  try {
    const ctx = getAudioContext();
    const fanfare = [
      { f: 523.25, d: 0.1 },  // C5
      { f: 659.25, d: 0.1 },  // E5
      { f: 783.99, d: 0.1 },  // G5
      { f: 1046.50, d: 0.35 } // C6
    ];
    let start = ctx.currentTime;
    fanfare.forEach((n) => {
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(n.f, start);
      gain.gain.setValueAtTime(0.25, start);
      gain.gain.exponentialRampToValueAtTime(0.001, start + n.d);
      osc.connect(gain);
      gain.connect(ctx.destination);
      osc.start(start);
      osc.stop(start + n.d);
      start += n.d * 0.85;
    });
  } catch (e) {}
}

/* ================= 碎紙花動畫系統 (Confetti Animation) ================= */
const confettiCanvas = document.getElementById('confetti-canvas');
const ctx = confettiCanvas.getContext('2d');
let particles = [];
let animationId = null;

function resizeCanvas() {
  confettiCanvas.width = window.innerWidth;
  confettiCanvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

function triggerConfetti(count = 45, isVictory = false) {
  const colors = ['#f43f5e', '#8b5cf6', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', '#06b6d4'];
  const centerX = window.innerWidth / 2;
  const centerY = isVictory ? window.innerHeight * 0.3 : window.innerHeight * 0.45;

  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = isVictory ? (Math.random() * 12 + 6) : (Math.random() * 8 + 4);
    particles.push({
      x: centerX,
      y: centerY,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - (isVictory ? 4 : 2),
      size: Math.random() * 8 + 6,
      color: colors[Math.floor(Math.random() * colors.length)],
      rotation: Math.random() * 360,
      vRotation: (Math.random() - 0.5) * 10,
      alpha: 1,
      gravity: 0.28
    });
  }
  if (!animationId) {
    renderConfetti();
  }
}

function renderConfetti() {
  ctx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
  particles.forEach((p, idx) => {
    p.x += p.vx;
    p.y += p.vy;
    p.vy += p.gravity;
    p.rotation += p.vRotation;
    p.alpha -= 0.015;

    ctx.save();
    ctx.globalAlpha = Math.max(0, p.alpha);
    ctx.translate(p.x, p.y);
    ctx.rotate((p.rotation * Math.PI) / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
    ctx.restore();

    if (p.alpha <= 0 || p.y > window.innerHeight) {
      particles.splice(idx, 1);
    }
  });

  if (particles.length > 0) {
    animationId = requestAnimationFrame(renderConfetti);
  } else {
    cancelAnimationFrame(animationId);
    animationId = null;
  }
}

let currentMode = "flashcard";
let currentUnitKey = "";
let activeList = [];
let currentIndex = 0;

let currentQuizList = [];
let quizIndex = 0;
let score = 0;
let activeRecognition = null;
let activeUtterance = null;

function normalizeText(t){
  return String(t||'').toLowerCase().replace(/[’']/g,'').replace(/[^a-z0-9\s]/g,'').replace(/\s+/g,' ').trim();
}
function shuffle(a){return [...a].sort(()=>Math.random()-.5);}
function escapeHtml(str){return String(str||'').replace(/[&<>'"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[ch]));}

function speakText(text){
  if('speechSynthesis' in window && text){
    window.speechSynthesis.cancel();
    setTimeout(() => {
      activeUtterance = new SpeechSynthesisUtterance(text);
      activeUtterance.lang = 'en-US';
      activeUtterance.rate = 0.8;
      window.speechSynthesis.speak(activeUtterance);
    }, 50);
  }
}

function pauseActivities(){
  if('speechSynthesis' in window) window.speechSynthesis.cancel();
  if(activeRecognition){
    try{ activeRecognition.abort(); }catch(e){}
    activeRecognition = null;
  }
}

function getUnitsForMode(mode){
  if(mode === 'sentencePractice') return passportData.sentences;
  return passportData.vocabularies;
}

function populateUnitSelector(){
  const select = document.getElementById('unitSelect');
  const units = getUnitsForMode(currentMode);
  select.innerHTML = '';
  Object.keys(units).forEach(k => {
    const op = document.createElement('option');
    op.value = k;
    op.textContent = k;
    select.appendChild(op);
  });
  currentUnitKey = Object.keys(units)[0] || '';
  if(currentUnitKey) select.value = currentUnitKey;
  activeList = units[currentUnitKey] || [];
  currentIndex = 0;
}

function switchMode(mode){
  pauseActivities();
  currentMode = mode;
  document.getElementById('modeSelect').value = mode;
  document.querySelectorAll('.mode-section').forEach(sec => sec.classList.remove('active'));
  document.getElementById(mode + '-mode')?.classList.add('active');
  populateUnitSelector();
  runCurrentMode();
}

function onUnitChange(){
  pauseActivities();
  const units = getUnitsForMode(currentMode);
  currentUnitKey = document.getElementById('unitSelect').value;
  activeList = units[currentUnitKey] || [];
  currentIndex = 0;
  runCurrentMode();
}

function runCurrentMode(){
  if(currentMode === 'flashcard') updateFlashcard();
  if(currentMode === 'phonicsQuiz') restartPhonicsQuiz();
  if(currentMode === 'sentencePractice') updateSentencePractice();
}

/* ================= 1. 閃示卡 ================= */
function updateFlashcard(){
  if(!activeList.length) return;
  if(currentIndex >= activeList.length) currentIndex = 0;
  const item = activeList[currentIndex];
  document.getElementById('fc-progress').innerText = `${currentIndex + 1} / ${activeList.length}`;
  document.getElementById('fc-letter').innerText = item.letter || item.word.charAt(0).toUpperCase();
  document.getElementById('fc-word').innerText = item.word;
  document.getElementById('fc-meaning').innerText = item.meaning;
}
function playCurrentWordAudio(){
  if(activeList[currentIndex]) speakText(activeList[currentIndex].word);
}
function nextWord(){
  if(!activeList.length) return;
  currentIndex = (currentIndex + 1) % activeList.length;
  updateFlashcard();
}
function prevWord(){
  if(!activeList.length) return;
  currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
  updateFlashcard();
}

/* ================= 2. 辨音測驗 ================= */
function restartPhonicsQuiz(){
  currentQuizList = shuffle(activeList);
  quizIndex = 0;
  score = 0;
  document.getElementById('phonics-quiz-view').style.display = 'block';
  document.getElementById('phonics-result-view').style.display = 'none';
  loadPhonicsQuestion();
}

function loadPhonicsQuestion(){
  if(quizIndex >= currentQuizList.length){
    showPhonicsResult();
    return;
  }
  const cur = currentQuizList[quizIndex];
  document.getElementById('phonics-progress').innerText = `題目 ${quizIndex + 1} / ${currentQuizList.length}`;
  const fb = document.getElementById('phonics-feedback');
  fb.className = 'feedback-box';
  fb.innerHTML = '';

  const allWords = passportData.vocabularies["全冊字母單字 (Aa - Zz)"].map(x => x.word);
  const choices = [cur.word];
  while(choices.length < Math.min(4, allWords.length)){
    const r = allWords[Math.floor(Math.random() * allWords.length)];
    if(!choices.includes(r)) choices.push(r);
  }

  const box = document.getElementById('phonics-quiz-options');
  box.innerHTML = '';
  shuffle(choices).forEach(choice => {
    const btn = document.createElement('button');
    btn.className = 'option-text-btn';
    btn.innerText = choice;
    btn.onclick = () => checkPhonicsAnswer(choice, cur);
    box.appendChild(btn);
  });

  speakText(cur.word);
}

function playPhonicsQuizAudio(){
  if(currentQuizList[quizIndex]) speakText(currentQuizList[quizIndex].word);
}

function triggerCardBounce(cardId) {
  const card = document.getElementById(cardId);
  if(card){
    card.classList.remove('bounce');
    void card.offsetWidth; // 強制重繪
    card.classList.add('bounce');
  }
}

function checkPhonicsAnswer(selected, correctItem){
  document.querySelectorAll('#phonics-quiz-options button').forEach(b => b.disabled = true);
  const fb = document.getElementById('phonics-feedback');
  
  if(selected === correctItem.word){
    score++;
    playSoundCorrect();
    triggerConfetti(40, false);
    triggerCardBounce('phonics-card');

    fb.className = 'feedback-box correct';
    fb.innerHTML = '🎉 答對了！太厲害了！';
    setTimeout(()=>{ quizIndex++; loadPhonicsQuestion(); }, 1000);
  }else{
    playSoundIncorrect();
    fb.className = 'feedback-box incorrect';
    fb.innerHTML = `正確答案是：<strong>${escapeHtml(correctItem.word)}</strong> (${correctItem.meaning})`;
    setTimeout(()=>{ quizIndex++; loadPhonicsQuestion(); }, 1800);
  }
}

function showPhonicsResult(){
  document.getElementById('phonics-quiz-view').style.display = 'none';
  const resView = document.getElementById('phonics-result-view');
  resView.style.display = 'flex';

  playSoundVictory();
  triggerConfetti(120, true);

  resView.innerHTML = `
    <div class="card-box bounce">
      <div style="font-size:3.5rem;animation:popSuccess 0.6s ease infinite alternate;">🏆</div>
      <h2 style="margin:12px 0 6px 0;font-size:1.6rem;color:#1e293b;">恭喜完成測驗！</h2>
      <p style="font-size:1.35rem;font-weight:900;color:#4f46e5;margin:8px 0;">總得分：${score} / ${currentQuizList.length}</p>
      <button class="btn btn-primary" onclick="restartPhonicsQuiz()" style="margin-top:16px;">🔄 再玩一次</button>
    </div>
  `;
}

/* ================= 3. 句子跟讀 ================= */
function updateSentencePractice(){
  if(!activeList.length) return;
  if(currentIndex >= activeList.length) currentIndex = 0;
  const item = activeList[currentIndex];
  document.getElementById('sentence-progress').innerText = `句子 ${currentIndex + 1} / ${activeList.length}`;
  document.getElementById('sentence-text').innerText = item.sentence;
  document.getElementById('sentence-meaning').innerText = item.meaning;
  const fb = document.getElementById('sentence-feedback');
  fb.className = 'feedback-box';
  fb.innerHTML = '';
}
function playCurrentSentenceAudio(){
  if(activeList[currentIndex]) speakText(activeList[currentIndex].sentence);
}
function nextSentenceItem(){
  if(!activeList.length) return;
  currentIndex = (currentIndex + 1) % activeList.length;
  updateSentencePractice();
}
function prevSentenceItem(){
  if(!activeList.length) return;
  currentIndex = (currentIndex - 1 + activeList.length) % activeList.length;
  updateSentencePractice();
}

function isSpeakingMatch(ans, cor){
  const a = normalizeText(ans), c = normalizeText(cor);
  if(!a || !c) return false;
  if(a === c) return true;
  const aw = a.split(' ').filter(Boolean), cw = c.split(' ').filter(Boolean);
  if(cw.length <= 1) return aw.includes(c);
  return cw.filter(w => aw.includes(w)).length / cw.length >= 0.45;
}

function startSentenceSpeechRecognition(){
  const item = activeList[currentIndex];
  if(!item) return;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const fb = document.getElementById('sentence-feedback');
  if(!SR){
    fb.className = 'feedback-box incorrect';
    fb.innerHTML = '此瀏覽器不支援語音辨識，建議使用 Google Chrome。';
    return;
  }
  if(activeRecognition){ 
    try{ activeRecognition.abort(); }catch(e){}
    activeRecognition = null;
  }
  const rec = new SR();
  activeRecognition = rec;
  rec.lang = 'en-US';
  rec.interimResults = false;
  rec.maxAlternatives = 1;
  fb.className = 'feedback-box';
  fb.innerHTML = '🎙️ 正在聆聽，請大聲念出句子...';

  rec.onresult = e => {
    const transcript = e.results?.[0]?.[0]?.transcript || '';
    const passed = isSpeakingMatch(transcript, item.sentence);
    
    if(passed) {
      playSoundCorrect();
      triggerConfetti(45, false);
      triggerCardBounce('sentence-card');
      fb.className = 'feedback-box correct';
      fb.innerHTML = `🎉 唸得真好！辨識到：<strong>${escapeHtml(transcript)}</strong>`;
    } else {
      playSoundIncorrect();
      fb.className = 'feedback-box incorrect';
      fb.innerHTML = `再試一次！<br>正確句子：<strong>${escapeHtml(item.sentence)}</strong><br>辨識結果：${escapeHtml(transcript || '未收到清楚聲音')}`;
    }
  };
  rec.onerror = () => {
    fb.className = 'feedback-box incorrect';
    fb.innerHTML = '沒有成功接收到聲音，請確認麥克風權限後重試。';
  };
  rec.onend = () => {
    activeRecognition = null;
  };
  
  try {
    rec.start();
  } catch(err) {
    activeRecognition = null;
    fb.className = 'feedback-box incorrect';
    fb.innerHTML = '啟動麥克風失敗，請重新點擊。';
  }
}

window.onload = () => {
  populateUnitSelector();
  runCurrentMode();
};
</script>
